
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Miniaturas Artísticas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: sans-serif; margin: 0; background: #fff; padding: 20px; }
    .container { max-width: 800px; margin: auto; }
    h1 { text-align: center; color: #333; }
    .product-card {
      border: 1px solid #ddd;
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
      background: #fafafa;
      text-align: center;
    }
    .btn {
      background: #27ae60;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 15px;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    #upload-area { margin-top: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Miniatura 3D Personalizada</h1>
    <div class="product-card">
      <h2>Escolha seu modelo</h2>
      <p>1 Boneco - <strong>R$ 84,90</strong></p>
      <button class="btn" onclick="document.getElementById('modal').style.display='block'">Comprar</button>
    </div>

    <div id="modal" style="display:none; margin-top:30px;">
      <h2>Envie sua foto para a miniatura</h2>
      <form action="checkout.html" method="get">
        <label>Foto da miniatura:</label>
        <input type="file" accept="image/png, image/jpeg" required>
        <label>Descrição ou instruções especiais (opcional):</label>
        <textarea name="detalhes" rows="4" placeholder="Descreva como você imagina sua miniatura..."></textarea>
        <button type="submit" class="btn">Finalizar e ir para pagamento</button>
      </form>
    </div>
  </div>
</body>
</html>
